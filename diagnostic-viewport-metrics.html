<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iOS Viewport Diagnostic - Black Flash Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0A0A0B;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 300vh;
    }

    .test-wallpaper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 0;
      animation: subtle-shift 20s ease-in-out infinite;
    }

    .test-vignette {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 10, 11, 0.7) 100%);
      z-index: 34;
      pointer-events: none;
    }

    .test-grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: contrast(120%) brightness(95%);
      z-index: 35;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' /%3E%3C/svg%3E");
    }

    @keyframes subtle-shift {
      0%, 100% { transform: scale(1.0) translateY(0); }
      50% { transform: scale(1.02) translateY(-1%); }
    }

    .metrics-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      z-index: 9999;
      font-size: 11px;
      line-height: 1.4;
      max-height: 90vh;
      overflow-y: auto;
    }

    .metrics-panel h2 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #4ade80;
    }

    .metrics-panel h3 {
      font-size: 12px;
      margin: 12px 0 6px;
      color: #60a5fa;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #222;
    }

    .metric-label {
      color: #999;
    }

    .metric-value {
      color: #fff;
      font-weight: 600;
    }

    .alert {
      background: #7f1d1d;
      padding: 8px;
      border-radius: 4px;
      margin: 8px 0;
      border-left: 3px solid #dc2626;
    }

    .warning {
      background: #713f12;
      padding: 8px;
      border-radius: 4px;
      margin: 8px 0;
      border-left: 3px solid #f59e0b;
    }

    .success {
      background: #14532d;
      padding: 8px;
      border-radius: 4px;
      margin: 8px 0;
      border-left: 3px solid #22c55e;
    }

    .content {
      position: relative;
      z-index: 100;
      padding: 60vh 20px 20px;
    }

    .spacer {
      height: 200vh;
    }

    .hit-test-marker {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      border: 2px solid white;
      pointer-events: none;
      z-index: 10000;
      display: none;
    }

    .toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #4ade80;
      color: black;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      z-index: 9999;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="test-wallpaper"></div>
  <div class="test-vignette"></div>
  <div class="test-grain"></div>
  <div class="hit-test-marker" id="hitMarker"></div>

  <div class="metrics-panel" id="metricsPanel">
    <h2>🔍 iOS Black Flash Diagnostic</h2>
    <div id="metricsContent">Loading...</div>
  </div>

  <button class="toggle-btn" id="toggleBtn">Hide Metrics</button>

  <div class="content">
    <div class="spacer"></div>
  </div>

  <script>
    const state = {
      issues: [],
      frameCount: 0,
      lastFlashDetected: null
    };

    function measureViewportMetrics() {
      const metrics = {
        windowInnerHeight: window.innerHeight,
        documentClientHeight: document.documentElement.clientHeight,
        visualViewportHeight: window.visualViewport?.height || 'N/A',
        visualViewportScale: window.visualViewport?.scale || 'N/A',
        scrollY: window.scrollY,
        scrollHeight: document.documentElement.scrollHeight,
        safeAreaBottom: getComputedStyle(document.documentElement).getPropertyValue('padding-bottom') || '0px'
      };

      const safeAreaInset = getCSSVariable('safe-area-inset-bottom');
      metrics.safeAreaInsetBottom = safeAreaInset;

      return metrics;
    }

    function getCSSVariable(varName) {
      const testDiv = document.createElement('div');
      testDiv.style.paddingBottom = `env(${varName})`;
      document.body.appendChild(testDiv);
      const value = getComputedStyle(testDiv).paddingBottom;
      document.body.removeChild(testDiv);
      return value;
    }

    function measureLayerGeometry() {
      const wallpaper = document.querySelector('.test-wallpaper');
      const vignette = document.querySelector('.test-vignette');
      const grain = document.querySelector('.test-grain');

      const layers = {
        wallpaper: measureElement(wallpaper, 'Wallpaper'),
        vignette: measureElement(vignette, 'Vignette'),
        grain: measureElement(grain, 'Grain')
      };

      return layers;
    }

    function measureElement(element, name) {
      if (!element) return { error: 'Element not found' };

      const rect = element.getBoundingClientRect();
      const computed = window.getComputedStyle(element);

      const data = {
        rect: {
          top: rect.top,
          bottom: rect.bottom,
          height: rect.height,
          width: rect.width
        },
        computed: {
          position: computed.position,
          top: computed.top,
          bottom: computed.bottom,
          left: computed.left,
          right: computed.right,
          inset: computed.inset,
          height: computed.height,
          minHeight: computed.minHeight,
          width: computed.width,
          zIndex: computed.zIndex,
          transform: computed.transform,
          backdropFilter: computed.backdropFilter || computed.webkitBackdropFilter,
          willChange: computed.willChange,
          backgroundColor: computed.backgroundColor
        }
      };

      const gap = rect.bottom - window.innerHeight;
      if (gap < -2) {
        state.issues.push(`⚠️ ${name} bottom gap: ${Math.abs(gap).toFixed(2)}px short`);
      }

      return data;
    }

    function performHitTest() {
      const testX = window.innerWidth / 2;
      const testY = window.innerHeight - 2;

      const hitMarker = document.getElementById('hitMarker');
      hitMarker.style.left = testX + 'px';
      hitMarker.style.top = testY + 'px';
      hitMarker.style.display = 'block';

      const element = document.elementFromPoint(testX, testY);

      const result = {
        x: testX,
        y: testY,
        element: element ? element.className || element.tagName : 'NULL',
        tagName: element?.tagName,
        isBody: element?.tagName === 'BODY',
        isHTML: element?.tagName === 'HTML'
      };

      if (result.isBody || result.isHTML) {
        state.issues.push(`🚨 BLACK FLASH DETECTED: Hit-test returned ${result.tagName} at bottom edge`);
        state.lastFlashDetected = Date.now();
      }

      return result;
    }

    function checkAncestorIsolation() {
      const wallpaper = document.querySelector('.test-wallpaper');
      let element = wallpaper?.parentElement;
      const isolations = [];

      while (element && element !== document.documentElement) {
        const computed = window.getComputedStyle(element);
        const isolation = {
          tag: element.tagName,
          overflow: computed.overflow,
          transform: computed.transform,
          filter: computed.filter,
          willChange: computed.willChange,
          isolation: computed.isolation
        };

        if (
          computed.overflow !== 'visible' ||
          computed.transform !== 'none' ||
          computed.filter !== 'none' ||
          computed.isolation === 'isolate'
        ) {
          isolations.push(isolation);
          state.issues.push(`⚠️ Ancestor ${isolation.tag} creates stacking context`);
        }

        element = element.parentElement;
      }

      return isolations;
    }

    function checkBackgroundColors() {
      const body = window.getComputedStyle(document.body).backgroundColor;
      const html = window.getComputedStyle(document.documentElement).backgroundColor;

      const colors = { body, html };

      if (body.includes('10, 10, 11') || body === 'rgb(10, 10, 11)') {
        state.issues.push(`✅ Body background is #0A0A0B (matches flash color)`);
      }

      return colors;
    }

    function renderMetrics() {
      state.issues = [];
      const viewport = measureViewportMetrics();
      const layers = measureLayerGeometry();
      const hitTest = performHitTest();
      const ancestors = checkAncestorIsolation();
      const backgrounds = checkBackgroundColors();

      let html = '<h3>A) Runtime Geometry</h3>';
      html += `<div class="metric-row"><span class="metric-label">window.innerHeight</span><span class="metric-value">${viewport.windowInnerHeight}px</span></div>`;
      html += `<div class="metric-row"><span class="metric-label">document.clientHeight</span><span class="metric-value">${viewport.documentClientHeight}px</span></div>`;
      html += `<div class="metric-row"><span class="metric-label">visualViewport.height</span><span class="metric-value">${viewport.visualViewportHeight}px</span></div>`;
      html += `<div class="metric-row"><span class="metric-label">visualViewport.scale</span><span class="metric-value">${viewport.visualViewportScale}</span></div>`;
      html += `<div class="metric-row"><span class="metric-label">scrollY</span><span class="metric-value">${viewport.scrollY.toFixed(0)}px</span></div>`;

      html += '<h3>B) Hit-Test Coverage (Bottom Edge)</h3>';
      html += `<div class="metric-row"><span class="metric-label">Test Point</span><span class="metric-value">(${hitTest.x}, ${hitTest.y})</span></div>`;
      html += `<div class="metric-row"><span class="metric-label">Element Hit</span><span class="metric-value">${hitTest.element}</span></div>`;

      if (hitTest.isBody || hitTest.isHTML) {
        html += '<div class="alert">🚨 FLASH ACTIVE: Background exposed at bottom edge</div>';
      } else {
        html += '<div class="success">✅ Layer coverage intact</div>';
      }

      html += '<h3>C) Layer Geometry</h3>';
      for (const [key, layer] of Object.entries(layers)) {
        html += `<div style="margin: 8px 0; padding: 8px; background: #1a1a1a; border-radius: 4px;">`;
        html += `<strong style="color: #60a5fa;">${key.toUpperCase()}</strong><br>`;
        html += `Bottom: ${layer.rect.bottom.toFixed(2)}px (innerHeight: ${viewport.windowInnerHeight}px)<br>`;
        html += `Height: ${layer.computed.height} (rect: ${layer.rect.height.toFixed(2)}px)<br>`;
        html += `Position: ${layer.computed.position} | Z-Index: ${layer.computed.zIndex}<br>`;
        html += `Transform: ${layer.computed.transform}<br>`;
        if (layer.computed.backdropFilter && layer.computed.backdropFilter !== 'none') {
          html += `Backdrop: ${layer.computed.backdropFilter}<br>`;
        }
        html += `</div>`;
      }

      html += '<h3>D) Background Colors</h3>';
      html += `<div class="metric-row"><span class="metric-label">body</span><span class="metric-value">${backgrounds.body}</span></div>`;
      html += `<div class="metric-row"><span class="metric-label">html</span><span class="metric-value">${backgrounds.html}</span></div>`;

      html += '<h3>E) Safe Area</h3>';
      html += `<div class="metric-row"><span class="metric-label">safe-area-inset-bottom</span><span class="metric-value">${viewport.safeAreaInsetBottom}</span></div>`;

      if (ancestors.length > 0) {
        html += '<h3>F) Stacking Context Issues</h3>';
        ancestors.forEach(a => {
          html += `<div class="warning">⚠️ ${a.tag}: overflow=${a.overflow}, transform=${a.transform}</div>`;
        });
      }

      if (state.issues.length > 0) {
        html += '<h3>⚠️ Issues Detected</h3>';
        state.issues.forEach(issue => {
          const cssClass = issue.includes('🚨') ? 'alert' : issue.includes('✅') ? 'success' : 'warning';
          html += `<div class="${cssClass}">${issue}</div>`;
        });
      }

      html += `<div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; font-size: 10px; color: #666;">`;
      html += `Frame: ${state.frameCount} | Last Flash: ${state.lastFlashDetected ? 'Active' : 'None'}`;
      html += `</div>`;

      document.getElementById('metricsContent').innerHTML = html;
      state.frameCount++;
    }

    let animationId;
    function startMonitoring() {
      function update() {
        renderMetrics();
        animationId = requestAnimationFrame(update);
      }
      update();
    }

    startMonitoring();

    window.addEventListener('scroll', () => {
      renderMetrics();
    });

    window.addEventListener('resize', () => {
      renderMetrics();
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        renderMetrics();
      });
      window.visualViewport.addEventListener('scroll', () => {
        renderMetrics();
      });
    }

    document.getElementById('toggleBtn').addEventListener('click', function() {
      const panel = document.getElementById('metricsPanel');
      if (panel.style.display === 'none') {
        panel.style.display = 'block';
        this.textContent = 'Hide Metrics';
      } else {
        panel.style.display = 'none';
        this.textContent = 'Show Metrics';
      }
    });
  </script>
</body>
</html>
