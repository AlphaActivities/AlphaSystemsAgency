<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Animation Test</title>
  <style>
    body {
      background: #0A0A0B;
      padding: 100px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    :root {
      --gold-400: #eac962;
      --gold-600: #b8941e;
    }

    @keyframes driftPulse {
      0%,100% { opacity: 1; transform: translateX(0); }
      50%     { opacity: 0.4; transform: translateX(2px); }
    }

    .hero-gold-beam {
      animation: driftPulse 3s ease-in-out infinite;
    }

    .test-text {
      font-size: 4rem;
      font-weight: bold;
      background: linear-gradient(to right, var(--gold-400), var(--gold-600));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .info {
      color: white;
      margin-top: 40px;
      font-size: 14px;
    }

    .control {
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      margin-right: 10px;
      background: #333;
      color: white;
      border: 1px solid #666;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1 style="color: white; margin-bottom: 40px;">DriftPulse Animation Test</h1>

  <div>
    <span class="test-text hero-gold-beam">Growth Engines</span>
  </div>

  <div class="info">
    <p>Animation should:</p>
    <ul>
      <li>Fade opacity from 1 → 0.4 → 1</li>
      <li>Move 2px to the right and back</li>
      <li>Complete cycle in 3 seconds</li>
      <li>Repeat infinitely</li>
    </ul>
  </div>

  <div class="control">
    <button onclick="toggleAnimation()">Toggle Animation</button>
    <button onclick="checkStyles()">Check Computed Styles</button>
  </div>

  <pre id="output" style="color: #888; margin-top: 20px; font-size: 12px;"></pre>

  <script>
    const element = document.querySelector('.hero-gold-beam');
    const output = document.getElementById('output');

    function toggleAnimation() {
      element.style.animationPlayState =
        element.style.animationPlayState === 'paused' ? 'running' : 'paused';
      output.textContent = `Animation: ${element.style.animationPlayState || 'running'}`;
    }

    function checkStyles() {
      const computed = window.getComputedStyle(element);
      output.textContent = `
Computed Animation Properties:
- animation-name: ${computed.animationName}
- animation-duration: ${computed.animationDuration}
- animation-timing-function: ${computed.animationTimingFunction}
- animation-iteration-count: ${computed.animationIterationCount}
- animation-play-state: ${computed.animationPlayState}
- opacity: ${computed.opacity}
- transform: ${computed.transform}
      `.trim();
    }

    // Auto-check on load
    setTimeout(checkStyles, 100);
  </script>
</body>
</html>
